[package]
name = "ssh-launcher"
version = "1.2.0"
description = "Portable SSH application chooser for 1Password SSH Bookmarks"
authors = ["StereoApp"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
systemicons = "0.9.13"
tauri = { version = "2", features = [] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
